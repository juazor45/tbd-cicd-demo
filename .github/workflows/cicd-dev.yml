#juazor 12/08/2026..
name: CICD-DEV
run-name: CICD-DEV · ${{ inputs.component }} · ${{ inputs.change_ticket }}

on:
  workflow_dispatch:
    inputs:
      component:
        description: 'Componente / microservicio a desplegar'
        required: true
        default: 'ms-exchange-rate'
      change_ticket:
        description: 'Ticket Jira (ej. SCRUM-6) - opcional en dev'
        required: false
        default: ''
      version_override:
        description: 'Forzar una versión específica (opcional -- normalmente se calcula sola con SemVer)'
        required: false
        default: ''
      run_cd:
        description: '¿Ejecutar despliegue (CD) después del CI?'
        required: true
        type: boolean
        default: true

env:
  ENVIRONMENT: dev

permissions:
  contents: read

jobs:
  # =========================================================
  # CI - Integración Continua (build REAL con Java + Maven)
  # =========================================================
  ci:
    name: CI (${{ github.event.inputs.component }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact_id: ${{ steps.publish.outputs.artifact_id }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # necesario: scripts/version.py necesita ver los tags e historial completo

      - name: Calcular versión (SemVer automático)
        id: version
        run: |
          if [ -n "${{ inputs.version_override }}" ]; then
            VERSION="${{ inputs.version_override }}"
            echo "⚠️  Usando versión forzada manualmente: $VERSION"
          else
            VERSION="$(python3 scripts/version.py --stage dev --explain)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "📦 Versión de este build: $VERSION"

      - name: Prepare (JDK 17 + Maven)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Get Secrets (HashiCorp Vault)
        run: |
          echo "🔐 [MOCK] Autenticando contra HashiCorp Vault (AppRole)..."
          echo "🔐 [MOCK] Leyendo secretos de path: secret/data/dev/${{ github.event.inputs.component }}"
          echo "✅ Secretos obtenidos e inyectados como variables enmascaradas"

      - name: Build & Unit Tests (Maven)
        run: mvn -B -Drevision=${{ steps.version.outputs.version }} verify

      - name: SonarQube (SAST / Quality Gate)
        run: |
          echo "📊 [MOCK] mvn sonar:sonar -Dsonar.projectKey=${{ github.event.inputs.component }}"
          echo "✅ Quality Gate: PASSED"

      - name: Fortify (SAST)
        run: |
          echo "🛡️ [MOCK] Escaneo Fortify SCA..."
          echo "✅ Security Gate Fortify: PASSED"

      - name: Publish Artifact
        id: publish
        run: |
          ARTIFACT_ID="${{ github.event.inputs.component }}-${{ steps.version.outputs.version }}"
          echo "📦 Artefacto generado: target/quarkus-app/ (fast-jar Quarkus)"
          echo "📦 [MOCK] Publicando en Artifactory (libs-snapshot-local)..."
          echo "artifact_id=$ARTIFACT_ID" >> "$GITHUB_OUTPUT"

      - name: Upload JAR
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.publish.outputs.artifact_id }}
          path: target/quarkus-app/

      - name: Component Test (contract testing vs mock server)
        run: |
          echo "🧪 [MOCK] Validando contratos de /api/v1/exchange-rates..."
          echo "✅ Component tests: PASSED"

      - name: SCA Xray
        run: |
          echo "🔍 [MOCK] Escaneando dependencias Maven con JFrog Xray..."
          echo "✅ SCA Xray: PASSED"

      - name: Jira - Construcción Done
        if: ${{ github.event.inputs.change_ticket != '' }}
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          TICKET: ${{ github.event.inputs.change_ticket }}
          TARGET_STATUS: 'Construcción Done'
        run: |
          TRANSITION_ID=$(curl -s -u "$JIRA_EMAIL:$JIRA_API_TOKEN" \
            "$JIRA_BASE_URL/rest/api/3/issue/$TICKET/transitions" \
            | jq -r --arg s "$TARGET_STATUS" '.transitions[] | select(.to.name==$s) | .id')
          if [ -z "$TRANSITION_ID" ]; then
            echo "⚠️ No hay transición hacia '$TARGET_STATUS'. Continuando."
            exit 0
          fi
          curl -s -X POST -u "$JIRA_EMAIL:$JIRA_API_TOKEN" \
            -H "Content-Type: application/json" \
            "$JIRA_BASE_URL/rest/api/3/issue/$TICKET/transitions" \
            -d "{\"transition\": {\"id\": \"$TRANSITION_ID\"}}"
          echo "📋 $TICKET → '$TARGET_STATUS' (CI de construcción completado)"

  # =========================================================
  # CD - Despliegue Continuo
  # =========================================================
  cd:
    name: CD → DEV (Azure Container Apps)
    runs-on: ubuntu-latest
    needs: ci
    if: ${{ github.event.inputs.run_cd == 'true' }}
    environment: dev
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare
        run: |
          echo "🔧 Preparando despliegue..."
          echo "Artefacto  : ${{ needs.ci.outputs.artifact_id }}"
          echo "Versión    : ${{ needs.ci.outputs.version }}"
          echo "Container App : ${{ vars.AZURE_APP_DEV }}"

      - name: Build and Push a GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          IMAGE="ghcr.io/${{ github.repository }}/${{ github.event.inputs.component }}"
          docker build -t "$IMAGE:${{ needs.ci.outputs.version }}" .
          docker push "$IMAGE:${{ needs.ci.outputs.version }}"
          echo "🐳 Imagen publicada: $IMAGE:${{ needs.ci.outputs.version }}"

      - name: Azure Login (OIDC, sin secretos)
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy a Azure Container Apps
        run: |
          az extension add --name containerapp --upgrade -y >/dev/null 2>&1
          az containerapp update \
            -g "${{ vars.AZURE_RESOURCE_GROUP }}" \
            -n "${{ vars.AZURE_APP_DEV }}" \
            --image "ghcr.io/${{ github.repository }}/${{ github.event.inputs.component }}:${{ needs.ci.outputs.version }}" \
            --min-replicas 0 --max-replicas 1
          az containerapp ingress update \
            -g "${{ vars.AZURE_RESOURCE_GROUP }}" \
            -n "${{ vars.AZURE_APP_DEV }}" \
            --target-port 8080
          echo "🚀 Desplegado en Azure Container Apps (dev)"

      - name: Smoke Test (verificación post-deploy)
        run: |
          APP_URL="https://$(az containerapp show -g "${{ vars.AZURE_RESOURCE_GROUP }}" -n "${{ vars.AZURE_APP_DEV }}" --query properties.configuration.ingress.fqdn -o tsv)"
          echo "⏳ Esperando readiness en $APP_URL (puede tardar por el arranque desde 0 réplicas)..."
          for i in $(seq 1 30); do
            curl -sf "$APP_URL/q/health/ready" && break
            sleep 5
          done
          echo ""
          echo "🧪 Probando endpoints:"
          curl -sf "$APP_URL/api/v1/exchange-rates"; echo ""
          curl -sf "$APP_URL/api/v1/exchange-rates/USD/convert?amount=100"; echo ""
          echo "✅ Servicio desplegado y respondiendo en DEV: $APP_URL"

  # =========================================================
  # Marca el commit como validado en DEV.
  # Ese status se asocia al SHA, no a la rama: si alguien empuja
  # un commit nuevo al PR, el nuevo SHA no lo tendrá y el merge
  # quedará bloqueado hasta volver a validar en DEV.
  # =========================================================
  marcar-validado:
    name: validado-en-dev
    runs-on: ubuntu-latest
    needs: [ci, cd]
    if: ${{ success() && github.ref_name != 'main' }}
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Publicar status en el commit
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d '{
              "state": "success",
              "context": "validado-en-dev",
              "description": "Desplegado y probado en DEV",
              "target_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }'
          echo "✅ Commit ${{ github.sha }} marcado como validado en DEV"
          echo "   Rama: ${{ github.ref_name }}"
