#juazor 12/08/2026
name: CICD-DEV
run-name: CICD-DEV · ${{ inputs.change_ticket }} · ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión del artefacto (ej. 1.0.0-SNAPSHOT)'
        required: true
        default: '1.0.0-SNAPSHOT'
      component:
        description: 'Componente / microservicio a desplegar'
        required: true
        default: 'ms-exchange-rate'
      change_ticket:
        description: 'Ticket Jira (ej. SCRUM-6) - opcional en dev'
        required: false
        default: ''
      run_cd:
        description: '¿Ejecutar despliegue (CD) después del CI?'
        required: true
        type: boolean
        default: true

env:
  ENVIRONMENT: dev
  REGISTRY: registry.demo.local/dev
  K8S_CLUSTER: aks-dev-cluster
  K8S_NAMESPACE: ns-dev

permissions:
  contents: read

jobs:
  # =========================================================
  # CI - Integración Continua (build REAL con Java + Maven)
  # =========================================================
  ci:
    name: CI (${{ github.event.inputs.component }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact_id: ${{ steps.publish.outputs.artifact_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare (JDK 17 + Maven)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Get Secrets (HashiCorp Vault)
        run: |
          echo "🔐 [MOCK] Autenticando contra HashiCorp Vault (AppRole)..."
          echo "🔐 [MOCK] Leyendo secretos de path: secret/data/dev/${{ github.event.inputs.component }}"
          echo "✅ Secretos obtenidos e inyectados como variables enmascaradas"

      - name: Build & Unit Tests (Maven)
        run: mvn -B verify

      - name: SonarQube (SAST / Quality Gate)
        run: |
          echo "📊 [MOCK] mvn sonar:sonar -Dsonar.projectKey=${{ github.event.inputs.component }}"
          echo "✅ Quality Gate: PASSED"

      - name: Fortify (SAST)
        run: |
          echo "🛡️ [MOCK] Escaneo Fortify SCA..."
          echo "✅ Security Gate Fortify: PASSED"

      - name: Publish Artifact
        id: publish
        run: |
          ARTIFACT_ID="${{ github.event.inputs.component }}-${{ github.event.inputs.version }}"
          echo "📦 Artefacto generado: target/quarkus-app/ (fast-jar Quarkus)"
          echo "📦 [MOCK] Publicando en Artifactory (libs-snapshot-local)..."
          echo "artifact_id=$ARTIFACT_ID" >> "$GITHUB_OUTPUT"

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.publish.outputs.artifact_id }}
          path: target/quarkus-app/

      - name: Component Test (contract testing vs mock server)
        run: |
          echo "🧪 [MOCK] Validando contratos de /api/v1/exchange-rates..."
          echo "✅ Component tests: PASSED"

      - name: SCA Xray
        run: |
          echo "🔍 [MOCK] Escaneando dependencias Maven con JFrog Xray..."
          echo "✅ SCA Xray: PASSED"

      - name: Jira - Construcción Done
        if: ${{ github.event.inputs.change_ticket \!= '' }}
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          TICKET: ${{ github.event.inputs.change_ticket }}
          TARGET_STATUS: 'Construcción Done'
        run: |
          TRANSITION_ID=$(curl -s -u "$JIRA_EMAIL:$JIRA_API_TOKEN" \
            "$JIRA_BASE_URL/rest/api/3/issue/$TICKET/transitions" \
            | jq -r --arg s "$TARGET_STATUS" '.transitions[] | select(.to.name==$s) | .id')
          if [ -z "$TRANSITION_ID" ]; then
            echo "⚠️ No hay transición hacia '$TARGET_STATUS'. Continuando."
            exit 0
          fi
          curl -s -X POST -u "$JIRA_EMAIL:$JIRA_API_TOKEN" \
            -H "Content-Type: application/json" \
            "$JIRA_BASE_URL/rest/api/3/issue/$TICKET/transitions" \
            -d "{\"transition\": {\"id\": \"$TRANSITION_ID\"}}"
          echo "📋 $TICKET → '$TARGET_STATUS' (CI de construcción completado)"

  # =========================================================
  # CD - Despliegue Continuo
  # =========================================================
  cd:
    name: CD → DEV
    runs-on: ubuntu-latest
    needs: ci
    if: ${{ github.event.inputs.run_cd == 'true' }}
    environment: dev
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare
        run: |
          echo "🔧 Preparando despliegue..."
          echo "Artefacto  : ${{ needs.ci.outputs.artifact_id }}"
          echo "Registry   : $REGISTRY"
          echo "Cluster    : $K8S_CLUSTER / Namespace: $K8S_NAMESPACE"

      - name: Build and Push Registry
        run: |
          IMAGE="$REGISTRY/${{ github.event.inputs.component }}:${{ github.event.inputs.version }}"
          docker build -t "$IMAGE" .
          echo "🐳 [MOCK] docker push $IMAGE (registry no existe en la demo)"
          echo "✅ Imagen construida: $IMAGE"

      - name: Set Runners
        run: |
          echo "🏃 [MOCK] Runner group: rg-k8s-dev | Labels: [self-hosted, dev, k8s]"
          echo "✅ Runners configurados"

      - name: Deploy to Kubernetes Cluster
        run: |
          IMAGE="$REGISTRY/${{ github.event.inputs.component }}:${{ github.event.inputs.version }}"
          echo "🚀 [MOCK] helm upgrade --install ... (cluster no existe en la demo)"
          echo "🚀 Simulando el despliegue levantando el contenedor en el runner..."
          docker run -d --name ms-demo -p 8080:8080 "$IMAGE"

      - name: Smoke Test (verificación post-deploy)
        run: |
          echo "⏳ Esperando readiness..."
          for i in $(seq 1 30); do
            curl -sf localhost:8080/q/health/ready && break
            sleep 2
          done
          echo ""
          echo "🧪 Probando endpoints:"
          curl -sf localhost:8080/api/v1/exchange-rates; echo ""
          curl -sf "localhost:8080/api/v1/exchange-rates/USD/convert?amount=100"; echo ""
          echo "✅ Servicio desplegado y respondiendo en DEV"

  # =========================================================
  # Marca el commit como validado en DEV.
  # Ese status se asocia al SHA, no a la rama: si alguien empuja
  # un commit nuevo al PR, el nuevo SHA no lo tendrá y el merge
  # quedará bloqueado hasta volver a validar en DEV.
  # =========================================================
  marcar-validado:
    name: validado-en-dev
    runs-on: ubuntu-latest
    needs: [ci, cd]
    if: ${{ success() && github.ref_name \!= 'main' }}
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Publicar status en el commit
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d '{
              "state": "success",
              "context": "validado-en-dev",
              "description": "Desplegado y probado en DEV",
              "target_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }'
          echo "✅ Commit ${{ github.sha }} marcado como validado en DEV"
          echo "   Rama: ${{ github.ref_name }}"
