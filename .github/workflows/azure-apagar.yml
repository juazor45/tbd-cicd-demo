name: Azure - Apagar
run-name: Azure Apagar · ${{ inputs.entorno }}

on:
  workflow_dispatch:
    inputs:
      entorno:
        description: 'Qué Container App apagar (slack = bot de Slack; ambas = dev + cert)'
        required: true
        type: choice
        options:
          - dev
          - cert
          - slack
          - ambas

permissions:
  contents: read
  id-token: write

jobs:
  apagar:
    name: Forzar 0 réplicas (costo garantizado en $0)
    runs-on: ubuntu-latest
    environment: ${{ inputs.entorno == 'cert' && 'cert' || 'dev' }}
    timeout-minutes: 10
    steps:
      - name: Azure Login (OIDC, sin secretos)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Apagar Container App(s)
        run: |
          az extension add --name containerapp --upgrade -y >/dev/null 2>&1
          # NOTA: Azure Container Apps no permite --max-replicas 0 (rango
          # valido: [1,1000]) -- "az containerapp update --max-replicas 0"
          # falla con "ERROR: --max-replicas must be in the range [1,1000]".
          # La forma correcta de garantizar 0 replicas (app inalcanzable,
          # costo $0) es desactivar la revision activa. No hace falta tocar
          # azure-encender.yml: "az containerapp update" (lo que ya hace
          # encender_app) crea y activa una revision nueva sola, sin
          # importar que la anterior haya quedado desactivada.
          apagar_app () {
            local NOMBRE="$1"
            local REV
            REV=$(az containerapp revision list -g "${{ vars.AZURE_RESOURCE_GROUP }}" -n "$NOMBRE" \
              --query "[?properties.active].name" -o tsv | head -n1)
            if [ -z "$REV" ]; then
              echo "✅ $NOMBRE ya estaba apagada (sin revisión activa)."
              return
            fi
            echo "🔻 Apagando $NOMBRE (desactivando la revisión activa: $REV)..."
            az containerapp revision deactivate -g "${{ vars.AZURE_RESOURCE_GROUP }}" -n "$NOMBRE" --revision "$REV"
            echo "✅ $NOMBRE apagada (revisión desactivada -- 0 réplicas garantizadas). Mientras esté así, su costo es \$0."
          }
          if [ "${{ inputs.entorno }}" = "dev" ] || [ "${{ inputs.entorno }}" = "ambas" ]; then
            apagar_app "${{ vars.AZURE_APP_DEV }}"
          fi
          if [ "${{ inputs.entorno }}" = "cert" ] || [ "${{ inputs.entorno }}" = "ambas" ]; then
            apagar_app "${{ vars.AZURE_APP_CERT }}"
          fi
          # "slack" queda fuera de "ambas" a propósito: es un servicio
          # distinto (el bot, no ms-exchange-rate), así que "ambas" sigue
          # significando "dev + cert" como siempre -- apagarlo es una
          # elección aparte. apagar_app le sirve tal cual (min=0 max=0 apaga
          # cualquier Container App, tenga o no ingress).
          if [ "${{ inputs.entorno }}" = "slack" ]; then
            apagar_app "${{ vars.AZURE_APP_SLACK }}"
          fi
