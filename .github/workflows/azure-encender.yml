name: Azure - Encender
run-name: Azure Encender · ${{ inputs.entorno }}

on:
  workflow_dispatch:
    inputs:
      entorno:
        description: 'Qué Container App encender (slack = bot de Slack; ambas = dev + cert)'
        required: true
        type: choice
        options:
          - dev
          - cert
          - slack
          - ambas

permissions:
  contents: read
  id-token: write

jobs:
  encender:
    name: Permitir de nuevo hasta 1 réplica
    runs-on: ubuntu-latest
    environment: ${{ inputs.entorno == 'cert' && 'cert' || 'dev' }}
    timeout-minutes: 10
    steps:
      - name: Azure Login (OIDC, sin secretos)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Encender Container App(s)
        run: |
          az extension add --name containerapp --upgrade -y >/dev/null 2>&1
          encender_app () {
            local NOMBRE="$1"
            echo "🔺 Encendiendo $NOMBRE (max-replicas 1, escala a 0 sola si no hay tráfico)..."
            az containerapp update -g "${{ vars.AZURE_RESOURCE_GROUP }}" -n "$NOMBRE" \
              --min-replicas 0 --max-replicas 1
            APP_URL="https://$(az containerapp show -g "${{ vars.AZURE_RESOURCE_GROUP }}" -n "$NOMBRE" --query properties.configuration.ingress.fqdn -o tsv)"
            echo "✅ $NOMBRE encendida: $APP_URL"
          }
          if [ "${{ inputs.entorno }}" = "dev" ] || [ "${{ inputs.entorno }}" = "ambas" ]; then
            encender_app "${{ vars.AZURE_APP_DEV }}"
          fi
          if [ "${{ inputs.entorno }}" = "cert" ] || [ "${{ inputs.entorno }}" = "ambas" ]; then
            encender_app "${{ vars.AZURE_APP_CERT }}"
          fi
          # El bot de Slack NO usa encender_app: esa función deja
          # min-replicas en 0 (para que dev/cert escalen a 0 solas sin
          # tráfico HTTP). El bot no tiene tráfico HTTP -- usa Socket Mode,
          # una conexión saliente permanente -- así que con min=0 se
          # apagaría solo enseguida. Necesita min=1 fijo. Tampoco tiene
          # ingress, así que no hay FQDN que mostrar; en su lugar, el
          # siguiente paso indica cómo confirmar que levantó.
          if [ "${{ inputs.entorno }}" = "slack" ]; then
            echo "🔺 Encendiendo ${{ vars.AZURE_APP_SLACK }} (min-replicas 1 -- Socket Mode no escala a 0)..."
            az containerapp update -g "${{ vars.AZURE_RESOURCE_GROUP }}" -n "${{ vars.AZURE_APP_SLACK }}" \
              --min-replicas 1 --max-replicas 1
            echo "✅ ${{ vars.AZURE_APP_SLACK }} encendida (sin ingress -- no tiene URL pública). Confirmá que conectó con:"
            echo "   az containerapp logs show -g ${{ vars.AZURE_RESOURCE_GROUP }} -n ${{ vars.AZURE_APP_SLACK }} --follow --tail 20"
          fi
