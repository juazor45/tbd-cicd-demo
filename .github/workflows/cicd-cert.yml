name: CICD-CERT
run-name: CICD-CERT · ${{ inputs.component }} · ${{ inputs.change_ticket }}

on:
  workflow_dispatch:
    inputs:
      component:
        description: 'Componente / microservicio a desplegar'
        required: true
        default: 'ms-exchange-rate'
      change_ticket:
        description: 'Ticket Jira (ej. SCRUM-6)'
        required: true
      version_override:
        description: 'Forzar una versión específica (opcional -- normalmente se calcula sola como release candidate SemVer)'
        required: false
        default: ''
      run_cd:
        description: '¿Ejecutar despliegue (CD) después del CI?'
        required: true
        type: boolean
        default: true

env:
  ENVIRONMENT: cert

permissions:
  contents: read

jobs:
  ci:
    name: CI (${{ github.event.inputs.component }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact_id: ${{ steps.publish.outputs.artifact_id }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # necesario: scripts/version.py necesita ver los tags e historial completo

      - name: Validar que el código proviene del trunk
        if: ${{ github.ref_name != 'main' }}
        run: |
          echo "❌ CICD-CERT solo puede ejecutarse desde 'main'."
          echo "   Rama recibida: ${{ github.ref_name }}"
          echo "   El código debe integrarse al trunk vía Pull Request (con CI y validado-en-dev) antes de certificar."
          exit 1

      - name: Prepare (JDK 17 + Maven)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Calcular versión de release candidate (SemVer automático)
        id: version
        run: |
          if [ -n "${{ inputs.version_override }}" ]; then
            VERSION="${{ inputs.version_override }}"
            echo "⚠️  Usando versión forzada manualmente: $VERSION"
          else
            VERSION="$(python3 scripts/version.py --stage rc --explain)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "📦 Versión de este release candidate: $VERSION"

      - name: Jira - Validar ticket e iniciar Congelamiento
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          TICKET: ${{ github.event.inputs.change_ticket }}
        run: |
          echo "📋 Consultando $TICKET en Jira..."
          STATUS=$(curl -s -u "$JIRA_EMAIL:$JIRA_API_TOKEN" \
            "$JIRA_BASE_URL/rest/api/3/issue/$TICKET?fields=status,summary" \
            | jq -r '.fields.status.name // empty')

          if [ -z "$STATUS" ]; then
            echo "❌ El ticket $TICKET no existe o las credenciales fallan. Abortando."
            exit 1
          fi
          echo "Estado actual: $STATUS"

          if [ "$STATUS" != "Construcción Done" ] && [ "$STATUS" != "Congelamiento Doing" ]; then
            echo "❌ Para promover a CERT el ticket debe estar en 'Construcción Done' (está en '$STATUS'). Abortando."
            exit 1
          fi

          # Mover a Congelamiento Doing (inicio de la promoción)
          TRANSITION_ID=$(curl -s -u "$JIRA_EMAIL:$JIRA_API_TOKEN" \
            "$JIRA_BASE_URL/rest/api/3/issue/$TICKET/transitions" \
            | jq -r '.transitions[] | select(.to.name=="Congelamiento Doing") | .id')
          if [ -n "$TRANSITION_ID" ]; then
            curl -s -X POST -u "$JIRA_EMAIL:$JIRA_API_TOKEN" \
              -H "Content-Type: application/json" \
              "$JIRA_BASE_URL/rest/api/3/issue/$TICKET/transitions" \
              -d "{\"transition\": {\"id\": \"$TRANSITION_ID\"}}"
            echo "📋 $TICKET → 'Congelamiento Doing'"
          fi

      - name: Get Secrets (HashiCorp Vault)
        run: |
          echo "🔐 [MOCK] Leyendo secretos de path: secret/data/cert/${{ github.event.inputs.component }}"
          echo "✅ Secretos obtenidos"

      - name: Build & Unit Tests (Maven)
        run: mvn -B -Drevision=${{ steps.version.outputs.version }} verify

      - name: SonarQube (SAST / Quality Gate)
        run: |
          echo "📊 [MOCK] Análisis SonarQube (perfil cert - estricto)..."
          echo "✅ Quality Gate: PASSED"

      - name: Fortify (SAST)
        run: |
          echo "🛡️ [MOCK] Escaneo Fortify (policy cert: 0 críticas y 0 altas)..."
          echo "✅ Security Gate Fortify: PASSED"

      - name: Publish Artifact
        id: publish
        run: |
          ARTIFACT_ID="${{ github.event.inputs.component }}-${{ steps.version.outputs.version }}"
          echo "📦 Artefacto generado: target/quarkus-app/ (fast-jar Quarkus)"
          echo "📦 [MOCK] Promoviendo a Artifactory (libs-release-candidate-local)..."
          echo "artifact_id=$ARTIFACT_ID" >> "$GITHUB_OUTPUT"

      - name: Upload JAR
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.publish.outputs.artifact_id }}
          path: target/quarkus-app/

      - name: Component Test (dependencias reales)
        run: |
          echo "🧪 [MOCK] Component tests contra dependencias REALES de cert..."
          echo "✅ Component tests: PASSED"

      - name: SCA Xray
        run: |
          echo "🔍 [MOCK] SCA Xray (policy cert, sin waivers)..."
          echo "✅ SCA Xray: PASSED"

      - name: Jira - Congelamiento Done
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          TICKET: ${{ github.event.inputs.change_ticket }}
        run: |
          TRANSITION_ID=$(curl -s -u "$JIRA_EMAIL:$JIRA_API_TOKEN" \
            "$JIRA_BASE_URL/rest/api/3/issue/$TICKET/transitions" \
            | jq -r '.transitions[] | select(.to.name=="Congelamiento Done") | .id')
          if [ -n "$TRANSITION_ID" ]; then
            curl -s -X POST -u "$JIRA_EMAIL:$JIRA_API_TOKEN" \
              -H "Content-Type: application/json" \
              "$JIRA_BASE_URL/rest/api/3/issue/$TICKET/transitions" \
              -d "{\"transition\": {\"id\": \"$TRANSITION_ID\"}}"
            echo "📋 $TICKET → 'Congelamiento Done' (artefacto RC listo, gates pasados)"
          fi

  cd:
    name: CD → CERT (Azure Container Apps)
    runs-on: ubuntu-latest
    needs: ci
    if: ${{ github.event.inputs.run_cd == 'true' }}
    environment: cert
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare
        run: |
          echo "🔧 Preparando despliegue en CERT..."
          echo "Artefacto     : ${{ needs.ci.outputs.artifact_id }}"
          echo "Versión       : ${{ needs.ci.outputs.version }}"
          echo "Change ticket : ${{ github.event.inputs.change_ticket }}"
          echo "Container App : ${{ vars.AZURE_APP_CERT }}"

      - name: Build and Push a GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          IMAGE="ghcr.io/${{ github.repository }}/${{ github.event.inputs.component }}"
          docker build -t "$IMAGE:${{ needs.ci.outputs.version }}" .
          docker push "$IMAGE:${{ needs.ci.outputs.version }}"
          echo "🐳 Imagen publicada: $IMAGE:${{ needs.ci.outputs.version }}"

      - name: Azure Login (OIDC, sin secretos)
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy a Azure Container Apps
        run: |
          az extension add --name containerapp --upgrade -y >/dev/null 2>&1
          az containerapp update \
            -g "${{ vars.AZURE_RESOURCE_GROUP }}" \
            -n "${{ vars.AZURE_APP_CERT }}" \
            --image "ghcr.io/${{ github.repository }}/${{ github.event.inputs.component }}:${{ needs.ci.outputs.version }}" \
            --min-replicas 0 --max-replicas 1
          az containerapp ingress update \
            -g "${{ vars.AZURE_RESOURCE_GROUP }}" \
            -n "${{ vars.AZURE_APP_CERT }}" \
            --target-port 8080
          echo "🚀 Desplegado en Azure Container Apps (cert)"

      - name: Smoke Test (verificación post-deploy)
        run: |
          APP_URL="https://$(az containerapp show -g "${{ vars.AZURE_RESOURCE_GROUP }}" -n "${{ vars.AZURE_APP_CERT }}" --query properties.configuration.ingress.fqdn -o tsv)"
          echo "⏳ Esperando readiness en $APP_URL..."
          for i in $(seq 1 30); do
            curl -sf "$APP_URL/q/health/ready" && break
            sleep 5
          done
          echo ""
          curl -sf "$APP_URL/api/v1/exchange-rates"; echo ""
          echo "✅ Servicio desplegado y respondiendo en CERT: $APP_URL"

      - name: Jira - QA Testing Doing
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          TICKET: ${{ github.event.inputs.change_ticket }}
        run: |
          TRANSITION_ID=$(curl -s -u "$JIRA_EMAIL:$JIRA_API_TOKEN" \
            "$JIRA_BASE_URL/rest/api/3/issue/$TICKET/transitions" \
            | jq -r '.transitions[] | select(.to.name=="QA Testing Doing") | .id')
          if [ -n "$TRANSITION_ID" ]; then
            curl -s -X POST -u "$JIRA_EMAIL:$JIRA_API_TOKEN" \
              -H "Content-Type: application/json" \
              "$JIRA_BASE_URL/rest/api/3/issue/$TICKET/transitions" \
              -d "{\"transition\": {\"id\": \"$TRANSITION_ID\"}}"
            echo "📋 $TICKET → 'QA Testing Doing' (desplegado en cert, listo para pruebas QA)"
          fi
