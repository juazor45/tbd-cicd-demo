name: CICD-CERT

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión del artefacto (ej. 1.0.0-RC1)'
        required: true
        default: '1.0.0-RC1'
      component:
        description: 'Componente / microservicio a desplegar'
        required: true
        default: 'ms-exchange-rate'
      change_ticket:
        description: 'Ticket de cambio en Jira (ej. DEMO-1)'
        required: true
      run_cd:
        description: '¿Ejecutar despliegue (CD) después del CI?'
        required: true
        type: boolean
        default: true

env:
  ENVIRONMENT: cert
  REGISTRY: registry.demo.local/cert
  K8S_CLUSTER: aks-cert-cluster
  K8S_NAMESPACE: ns-cert

jobs:
  ci:
    name: CI (${{ github.event.inputs.component }})
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.publish.outputs.artifact_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare (JDK 17 + Maven)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Validate Jira Change Ticket
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          TICKET: ${{ github.event.inputs.change_ticket }}
        run: |
          if [ -z "$JIRA_BASE_URL" ]; then
            echo "📋 [MOCK] Secrets de Jira no configurados; validación simulada de $TICKET → APROBADO"
            exit 0
          fi
          echo "📋 Consultando estado de $TICKET en Jira..."
          STATUS=$(curl -s -u "$JIRA_EMAIL:$JIRA_API_TOKEN" \
            -H "Accept: application/json" \
            "$JIRA_BASE_URL/rest/api/3/issue/$TICKET?fields=status" | jq -r '.fields.status.name')
          echo "Estado actual: $STATUS"
          if [ "$STATUS" != "Aprobado" ]; then
            echo "❌ El ticket $TICKET no está Aprobado (estado: $STATUS). Abortando."
            exit 1
          fi
          echo "✅ Ticket aprobado"

      - name: Get Secrets (HashiCorp Vault)
        run: |
          echo "🔐 [MOCK] Autenticando contra HashiCorp Vault (AppRole)..."
          echo "🔐 [MOCK] Leyendo secretos de path: secret/data/cert/${{ github.event.inputs.component }}"
          echo "✅ Secretos obtenidos"

      - name: Build & Unit Tests (Maven)
        run: mvn -B verify

      - name: SonarQube (SAST / Quality Gate)
        run: |
          echo "📊 [MOCK] Análisis SonarQube (perfil cert - estricto)..."
          echo "✅ Quality Gate: PASSED"

      - name: Fortify (SAST)
        run: |
          echo "🛡️ [MOCK] Escaneo Fortify (policy cert: 0 críticas y 0 altas)..."
          echo "✅ Security Gate Fortify: PASSED"

      - name: Publish Artifact
        id: publish
        run: |
          ARTIFACT_ID="${{ github.event.inputs.component }}-${{ github.event.inputs.version }}"
          echo "📦 Artefacto generado: target/quarkus-app/ (fast-jar Quarkus)"
          echo "📦 [MOCK] Promoviendo a Artifactory (libs-release-candidate-local)..."
          echo "artifact_id=$ARTIFACT_ID" >> "$GITHUB_OUTPUT"

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.publish.outputs.artifact_id }}
          path: target/quarkus-app/

      - name: Component Test (dependencias reales)
        run: |
          echo "🧪 [MOCK] Component tests contra dependencias REALES de cert..."
          echo "✅ Component tests: PASSED"

      - name: SCA Xray
        run: |
          echo "🔍 [MOCK] SCA Xray (policy cert, sin waivers)..."
          echo "✅ SCA Xray: PASSED"

  cd:
    name: CD → CERT
    runs-on: ubuntu-latest
    needs: ci
    if: ${{ github.event.inputs.run_cd == 'true' }}
    environment: cert
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare
        run: |
          echo "🔧 Preparando despliegue en CERT..."
          echo "Artefacto     : ${{ needs.ci.outputs.artifact_id }}"
          echo "Change ticket : ${{ github.event.inputs.change_ticket }}"

      - name: Build and Push Registry
        run: |
          IMAGE="$REGISTRY/${{ github.event.inputs.component }}:${{ github.event.inputs.version }}"
          echo "🐳 Construyendo imagen con el Dockerfile del repo..."
          docker build -t "$IMAGE" .
          echo "🐳 [MOCK] docker push $IMAGE"
          echo "✅ Imagen construida: $IMAGE"

      - name: Set Runners
        run: |
          echo "🏃 [MOCK] Runner group: rg-k8s-cert | Labels: [self-hosted, cert, k8s]"
          echo "✅ Runners configurados"

      - name: Deploy to Kubernetes Cluster
        run: |
          echo "🚀 [MOCK] helm upgrade --install ${{ github.event.inputs.component }} ./chart -n $K8S_NAMESPACE"
          echo "📋 [MOCK] Actualizando ${{ github.event.inputs.change_ticket }} en Jira → Desplegado en CERT"
          echo "✅ Despliegue en CERT completado"
