name: CICD-CERT

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión del artefacto (ej. 1.0.0-RC1)'
        required: true
        default: '1.0.0-RC1'
      component:
        description: 'Componente / microservicio a desplegar'
        required: true
        default: 'ms-demo'
      change_ticket:
        description: 'Ticket de cambio en Jira (ej. CHG-1234)'
        required: true
      run_cd:
        description: '¿Ejecutar despliegue (CD) después del CI?'
        required: true
        type: boolean
        default: true

env:
  ENVIRONMENT: cert
  REGISTRY: registry.demo.local/cert
  K8S_CLUSTER: aks-cert-cluster
  K8S_NAMESPACE: ns-cert

jobs:
  # =========================================================
  # CI - Integración Continua (gates más estrictos en CERT)
  # =========================================================
  ci:
    name: CI (${{ github.event.inputs.component }})
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.publish.outputs.artifact_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare
        run: |
          echo "🔧 [MOCK] Preparando workspace..."
          echo "Componente     : ${{ github.event.inputs.component }}"
          echo "Versión        : ${{ github.event.inputs.version }}"
          echo "Change ticket  : ${{ github.event.inputs.change_ticket }}"
          echo "Branch         : ${{ github.ref_name }}"
          echo "Ambiente       : $ENVIRONMENT"
          echo "📋 [MOCK] Validando estado del cambio en Jira... APROBADO"

      - name: Get Secrets (HashiCorp Vault)
        run: |
          echo "🔐 [MOCK] Autenticando contra HashiCorp Vault (AppRole)..."
          echo "🔐 [MOCK] Leyendo secretos de path: secret/data/cert/${{ github.event.inputs.component }}"
          echo "✅ Secretos obtenidos e inyectados como variables enmascaradas"

      - name: SonarQube (SAST / Quality Gate)
        run: |
          echo "📊 [MOCK] Ejecutando análisis SonarQube (perfil cert - estricto)..."
          echo "   Coverage: 84.2% (mínimo cert: 80%) | Vulnerabilities: 0"
          echo "✅ Quality Gate: PASSED"

      - name: Fortify (SAST)
        run: |
          echo "🛡️ [MOCK] Ejecutando escaneo Fortify SCA (policy cert)..."
          echo "   Critical: 0 | High: 0 (policy cert: 0 críticas y 0 altas)"
          echo "✅ Security Gate Fortify: PASSED"

      - name: Publish Artifact
        id: publish
        run: |
          ARTIFACT_ID="${{ github.event.inputs.component }}-${{ github.event.inputs.version }}"
          echo "📦 [MOCK] Promoviendo/publicando artefacto en Artifactory..."
          echo "   Artefacto: $ARTIFACT_ID.jar"
          echo "   Repo: libs-release-candidate-local"
          echo "artifact_id=$ARTIFACT_ID" >> "$GITHUB_OUTPUT"
          echo "✅ Artefacto publicado: $ARTIFACT_ID"

      - name: Component Test (dependencias reales)
        run: |
          echo "🧪 [MOCK] Ejecutando component tests contra dependencias REALES de cert..."
          echo "   Tests ejecutados: 42 | Passed: 42 | Failed: 0"
          echo "✅ Component tests: PASSED"

      - name: SCA Xray
        run: |
          echo "🔍 [MOCK] Ejecutando análisis SCA con JFrog Xray (policy cert)..."
          echo "   Dependencias escaneadas: 137"
          echo "   Violations: 0 (policy cert no admite waivers de críticas/altas)"
          echo "✅ SCA Xray: PASSED"

  # =========================================================
  # CD - Despliegue Continuo (con approval gate vía environment)
  # =========================================================
  cd:
    name: CD → CERT
    runs-on: ubuntu-latest
    needs: ci
    if: ${{ github.event.inputs.run_cd == 'true' }}
    environment: cert   # configurar required reviewers en Settings > Environments
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare
        run: |
          echo "🔧 [MOCK] Preparando despliegue en CERT..."
          echo "Artefacto     : ${{ needs.ci.outputs.artifact_id }}"
          echo "Change ticket : ${{ github.event.inputs.change_ticket }}"
          echo "Cluster       : $K8S_CLUSTER"
          echo "Namespace     : $K8S_NAMESPACE"

      - name: Build and Push Registry
        run: |
          IMAGE="$REGISTRY/${{ github.event.inputs.component }}:${{ github.event.inputs.version }}"
          echo "🐳 [MOCK] docker build -t $IMAGE ."
          echo "🐳 [MOCK] docker push $IMAGE"
          echo "✅ Imagen publicada en registry: $IMAGE"

      - name: Set Runners
        run: |
          echo "🏃 [MOCK] Seleccionando self-hosted runners con acceso al cluster CERT..."
          echo "   Runner group: rg-k8s-cert | Labels: [self-hosted, cert, k8s]"
          echo "✅ Runners configurados"

      - name: Deploy to Kubernetes Cluster
        run: |
          echo "🚀 [MOCK] kubectl config use-context $K8S_CLUSTER"
          echo "🚀 [MOCK] helm upgrade --install ${{ github.event.inputs.component }} ./chart \\"
          echo "          --namespace $K8S_NAMESPACE \\"
          echo "          --set image.tag=${{ github.event.inputs.version }}"
          echo "🚀 [MOCK] kubectl rollout status deployment/${{ github.event.inputs.component }} -n $K8S_NAMESPACE"
          echo "📋 [MOCK] Actualizando ticket ${{ github.event.inputs.change_ticket }} en Jira → Desplegado en CERT"
          echo "✅ Despliegue en CERT completado"
