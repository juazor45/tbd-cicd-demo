version: 2
updates:
  # Mantiene al día las GitHub Actions usadas en los workflows (fijadas por SHA).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(actions)"

  # Mantiene al día Quarkus, plugins de Maven y demás dependencias del pom.xml.
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
