# Template del proceso de release (DeployGo demo)
# El asistente cruza el estado de Jira + los pipelines de GitHub contra este mapa.
# Cada fase define: descripción, qué la evidencia, y cuál es el siguiente paso.

process:
  name: "Proceso de release ms-exchange-rate (TBD + CI/CD dev/cert)"
  phases:

    - jira_status: "Tareas por hacer"
      phase: "Planificación"
      description: "El ticket existe pero el desarrollo no ha iniciado."
      evidence: "Sin rama asociada; sin ejecuciones de pipeline."
      next_step: "Crear la rama con la convención feature/<TICKET>-descripcion (dispara Jira-Branch y mueve a Construcción Doing)."

    - jira_status: "Construcción Doing"
      phase: "Construcción"
      description: "Desarrollo en curso en una rama corta (TBD)."
      evidence: "Workflow Jira-Branch ejecutado; commits en la rama feature."
      next_step: "Abrir Pull Request hacia main; el check CI (ci-pr.yml) debe pasar; luego squash merge y ejecutar CICD-DEV con el ticket."

    - jira_status: "Construcción Done"
      phase: "Construcción finalizada"
      description: "El código está integrado al trunk y validado en DEV (CI con gates de calidad y seguridad, artefacto SNAPSHOT publicado, desplegado y con smoke test OK en dev)."
      evidence: "Run exitoso de CICD-DEV con este ticket."
      next_step: "Ejecutar CICD-CERT con version RC (ej. 1.0.0-RC1) y el ticket como change_ticket para iniciar el congelamiento."

    - jira_status: "Congelamiento Doing"
      phase: "Congelamiento"
      description: "Promoción a certificación en curso: se está construyendo y validando el artefacto RC con policies estrictas."
      evidence: "Run de CICD-CERT en progreso (job CI)."
      next_step: "Esperar que el CI de CICD-CERT termine; si falla algún gate, corregir en una nueva rama y repetir el ciclo."

    - jira_status: "Congelamiento Done"
      phase: "Congelamiento finalizado"
      description: "Artefacto RC publicado con todos los gates aprobados. Listo para desplegar en CERT."
      evidence: "Job CI de CICD-CERT exitoso; job CD esperando aprobación (environment cert)."
      next_step: "Aprobar el despliegue en GitHub (Review deployments → cert → Approve and deploy)."

    - jira_status: "QA Testing Doing"
      phase: "QA Testing"
      description: "El servicio está desplegado en CERT (smoke test OK) y QA está ejecutando las pruebas de certificación."
      evidence: "Run de CICD-CERT completo, incluido el CD con smoke test."
      next_step: "QA ejecuta sus casos de prueba; al certificar, mover manualmente el ticket a QA Testing Done."

    - jira_status: "QA Testing Done"
      phase: "Certificado"
      description: "QA certificó la versión. El release está listo para producción."
      evidence: "Ticket movido manualmente por QA."
      next_step: "Fin del alcance de la demo (siguiente evolución: pipeline CICD-PROD con su propio approval y change management)."
