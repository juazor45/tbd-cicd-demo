# release-status — Fase 1 del SDLC agentico: Agent Registry.
#
# Agente de solo lectura: responde "en que estado esta mi release y que
# sigue" cruzando Jira, GitHub Actions y el template del proceso. No tiene
# ninguna tool de escritura, por eso no necesita HITL.

id: release-status
owner: juan.zorrilla
proposito: "Responder en que fase del proceso esta un release y cual es el siguiente paso"
tools_permitidas:
  - consultar_jira
  - consultar_pipelines
  - detalle_ejecucion
  - consultar_proceso
nivel_autonomia: L1
modo_hitl: ninguno
canal_autorizado: cualquiera
rate_limit: "compartido con el resto del asistente (ver bot-policy.yml)"
