# deploy-readiness — Fase 4 del SDLC agentico: advisory visible.
#
# Antes de correr CICD-CERT, cruza Jira, el historial de pipelines, el spec
# del ticket y deploy-policy.yml para dar un veredicto de lectura, con
# criterio mas amplio que el chequeo determinista de deploy-policy (rama +
# estado exacto de Jira). Corre desde cicd-cert.yml.
#
# Nota sobre el salto de Fase 3 a Fase 4: el plan original preveia pasar a
# advisory visible recien cuando el modo sombra (Fase 3) acumulara evidencia
# real de precision. Se decidio avanzar antes de tener esa evidencia -- el
# veredicto ahora es visible, pero sigue sin bloquear nada (continue-on-error
# en cicd-cert.yml) y agent-log.jsonl se sigue subiendo como artifact, para
# poder seguir midiendo precision con el agente ya visible.
#
# El canal elegido a proposito NO es un comentario automatico en Jira: eso
# escribiria en el ticket sin que nadie lo confirme, algo que este mismo
# registro trata como una accion con efectos reales (ver el comentario en
# ticket-intake.yml sobre por que crear_ticket/comentar_ticket exigen
# confirmacion explicita). En cambio, el veredicto se escribe en el resumen
# del job de GitHub Actions (visible para quien dispare o revise esa corrida
# de CICD-CERT) -- informativo, sin escribir en ningun sistema externo.

id: deploy-readiness
owner: juan.zorrilla
proposito: "Evaluar si un ticket esta listo para certificar, antes de CICD-CERT, y mostrar el veredicto de forma advisory"
tools_permitidas:
  - evaluar_readiness
nivel_autonomia: L1
modo_hitl: approval-after
canal_autorizado: "resumen del job en cicd-cert.yml (visible en el run de GitHub Actions, advisory -- nunca bloquea, no escribe en Jira ni en el PR)"
rate_limit: "uno por corrida de CICD-CERT"
