quarkus.application.name=ms-exchange-rate
quarkus.http.port=8080

# Health checks para Kubernetes:
#   liveness : /q/health/live
#   readiness: /q/health/ready
quarkus.smallrye-health.root-path=/q/health

# CORS: habilitado para que la interfaz web de prueba (web/index.html,
# servida como static website desde Azure Storage, otro origen) pueda
# llamar a esta API desde el navegador. "*" es aceptable aca porque la API
# es de solo lectura y con datos de demo (ver README, seccion "Alcance") --
# si esto alguna vez sirve datos reales, restringir a los origenes
# concretos que la consuman.
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET
